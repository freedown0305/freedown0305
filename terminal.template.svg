<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: Jk, full-stack developer" width="820" height="360" viewBox="0 0 820 360">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .p { fill: #3fb950; font-weight: 600; }
    .d { fill: #58a6ff; font-weight: 600; }
    .t { fill: #e6edf3; }
    .m { fill: #7d8590; }
    .k { fill: #d2a8ff; }
    .y { fill: #e3b341; }
    .o { opacity: 0; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="819" height="359" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="819" height="36" rx="10" fill="#161b22"/>
  <rect x="0.5" y="26" width="819" height="11" fill="#161b22"/>
  <line x1="0" y1="36.5" x2="820" y2="36.5" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="410" y="23" text-anchor="middle" class="mono m" style="font-size:13px">jk@github: ~</text>

  <defs>
    <clipPath id="c1"><rect x="0" y="50" height="26" width="0"><animate id="a1" attributeName="width" from="141" to="200" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="122" height="26" width="0"><animate id="a2" attributeName="width" from="141" to="262" begin="a1.end+0.9s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="244" height="26" width="0"><animate id="a3" attributeName="width" from="141" to="298" begin="a2.end+1.4s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <g class="mono">
    <text x="24" y="68"><tspan class="p">jk@github</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ </tspan></text>
    <text x="24" y="68" clip-path="url(#c1)"><tspan class="p" fill-opacity="0">jk@github</tspan><tspan fill-opacity="0">:~$ </tspan><tspan class="t">whoami</tspan></text>
    <text x="24" y="94" class="o t">Jk <tspan class="m">&#183;</tspan> full-stack developer <tspan class="m">&#183;</tspan> 10 years in production
      <set attributeName="opacity" to="1" begin="a1.end+0.2s" fill="freeze"/></text>

    <g opacity="0"><set attributeName="opacity" to="1" begin="a1.end+0.6s" fill="freeze"/>
      <text x="24" y="140"><tspan class="p">jk@github</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ </tspan></text>
    </g>
    <text x="24" y="140" clip-path="url(#c2)"><tspan fill-opacity="0">jk@github:~$ </tspan><tspan class="t">cat stack.txt</tspan></text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="a2.end+0.2s" fill="freeze"/>
      <text x="24" y="166"><tspan class="k">backend</tspan><tspan class="t" x="124">Laravel &#183; PHP &#183; MySQL &#183; Redis</tspan></text>
      <text x="24" y="190"><tspan class="k">frontend</tspan><tspan class="t" x="124">TypeScript &#183; React &#183; Next.js &#183; Vite</tspan></text>
      <text x="24" y="214"><tspan class="k">infra</tspan><tspan class="t" x="124">AWS &#183; Docker &#183; Terraform &#183; GitHub Actions</tspan></text>
    </g>

    <g opacity="0"><set attributeName="opacity" to="1" begin="a2.end+1.0s" fill="freeze"/>
      <text x="24" y="262"><tspan class="p">jk@github</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ </tspan></text>
    </g>
    <text x="24" y="262" clip-path="url(#c3)"><tspan fill-opacity="0">jk@github:~$ </tspan><tspan class="t">stats --last-year</tspan></text>
    <text x="24" y="288" class="o"><tspan class="y">{{TOTAL}}</tspan><tspan class="t"> contributions </tspan><tspan class="m">&#183;</tspan><tspan class="t"> {{STREAK_LABEL}} </tspan><tspan class="y">{{STREAK_VALUE}}</tspan>
      <set attributeName="opacity" to="1" begin="a3.end+0.3s" fill="freeze"/></text>

    <g opacity="0"><set attributeName="opacity" to="1" begin="a3.end+0.8s" fill="freeze"/>
      <text x="24" y="330"><tspan class="p">jk@github</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ </tspan></text>
      <rect x="143" y="316" width="9" height="18" fill="#e6edf3" class="blink"/>
    </g>
  </g>
</svg>
